spring:
  application:
    name: USER-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/microservices
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Prints SQL statements to the console
    show-sql: true
    hibernate:
      # Manages database schema generation
      ddl-auto: update
    properties:
      hibernate:
        # Formats the printed SQL for better readability
        format_sql: true


server:
  port: 8081



